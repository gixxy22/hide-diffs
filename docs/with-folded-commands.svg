<svg xmlns="http://www.w3.org/2000/svg" width="860" height="164" viewBox="0 0 860 164" role="img" aria-label="With folded commands">
<rect width="860" height="164" rx="10" fill="#1e1e1e"/>
<circle cx="20" cy="16" r="5" fill="#ff5f57"/><circle cx="37" cy="16" r="5" fill="#febc2e"/><circle cx="54" cy="16" r="5" fill="#28c840"/>
<text x="430.0" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8a8a8a">With folded commands</text>
<text x="18" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#7ee787">● </tspan><tspan fill="#d4d4d4">Bash</tspan><tspan fill="#8a8a8a">(cd src &amp;&amp; grep -rn &quot;fetchUser\|getUser&quot; --include=&quot;*.ts&quot; api routes | cut -c1-200;…)</tspan><tspan fill="#8a8a8a">  ⎿  </tspan><tspan fill="#8a8a8a">16 lines</tspan></text>
<text x="18" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#7ee787">● </tspan><tspan fill="#d4d4d4">Bash</tspan><tspan fill="#8a8a8a">(npm test -- --run src/api)</tspan><tspan fill="#8a8a8a">  ⎿  </tspan><tspan fill="#8a8a8a">24 lines</tspan></text>
<text x="18" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#ff9492">● </tspan><tspan fill="#d4d4d4">Bash</tspan><tspan fill="#8a8a8a">(npx tsc --noEmit)</tspan><tspan fill="#8a8a8a">  ⎿  </tspan><tspan fill="#ff9492">Exit code 2 (+3 lines)</tspan></text>
<text x="18" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#8a8a8a">  Diffs hidden (ctrl+q to show) · Commands folded (alt+q to show)</tspan></text>
</svg>
